name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Catches breakage in the @internal Inertia APIs we depend on
  # when new @inertiajs/core versions ship.
  inertia-compat:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        inertia: ['3.4.0', 'latest']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --no-save @inertiajs/core@${{ matrix.inertia }}
      - run: npm run typecheck && npm test
